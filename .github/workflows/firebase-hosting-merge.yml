name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: astrowind/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./astrowind
      - name: Lint
        run: npm run check:eslint
        working-directory: ./astrowind
        continue-on-error: true
      - name: Build
        run: npm run build
        working-directory: ./astrowind
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ITCLOUDX_COM }}
          channelId: live
          projectId: itcloudx-com
        if: success()
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const message = `🚨 **Deploy to Firebase Hosting failed on \`${context.ref}\`!** Check the [workflow run](${runUrl}) for details.`;
            // On push to main there is no PR — create a commit status comment instead
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message,
            });
