name: Weekly Blog Publish (DISABLED - Use Cloud Scheduler)
# Publishing is now handled by Google Cloud Scheduler + Cloud Function
# weekly_publish function at: https://us-central1-itcloudx-com.cloudfunctions.net/weekly_publish
# Scheduler runs every Sunday 8am PT
# To trigger manually: curl -X POST https://us-central1-itcloudx-com.cloudfunctions.net/weekly_publish

on:
  workflow_dispatch:  # Manual only - no automatic schedule

permissions:
  contents: write

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Publishing moved to Cloud Scheduler
        run: |
          echo "Blog publishing is now handled by Google Cloud Scheduler"
          echo "Function: https://us-central1-itcloudx-com.cloudfunctions.net/weekly_publish"
          echo "Schedule: Every Sunday 8am PT (0 15 * * 0)"
          echo "To trigger manually: curl -X POST [function_url]"
